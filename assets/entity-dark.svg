<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">ENTITY — a presence on the workbench</title>
  <desc id="desc">An abstract amber eye suspended within fine, flowing contours. Original decorative illustration for Hruthvik's workshop.</desc>
